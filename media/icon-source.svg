  <line x1="20" y1="20" x2="99.2" y2="99.2" stroke="#8fa3b8" stroke-width="1.6"/>
  <line x1="20" y1="20" x2="62.9" y2="123.5" stroke="#8fa3b8" stroke-width="1.6"/>
  <line x1="20" y1="20" x2="20.0" y2="132.0" stroke="#8fa3b8" stroke-width="1.6"/>

